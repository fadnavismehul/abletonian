name: Task
description: A scoped piece of agreed work, usually a sub-issue of a feature or RFC tracking issue.
type: Task
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files or modules involved, and what is explicitly out of scope.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks that prove it, such as tests, docs, or a run in Live.
    validations:
      required: true
